# HTTP 服务器（自动跳转 HTTPS）
server {
    listen 80;
    server_name www.enfuri51.xyz enfuri51.xyz;

    # 自动跳转到 HTTPS
    return 301 https://www.enfuri51.xyz$request_uri;
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name www.enfuri51.xyz enfuri51.xyz;

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/www.enfuri51.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.enfuri51.xyz/privkey.pem;

    # SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS（可选，增强安全性）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 限制请求体大小（视频上传）
    client_max_body_size 100M;

    # 日志配置
    access_log /var/log/nginx/sora-api-access.log;
    error_log /var/log/nginx/sora-api-error.log;

    # API 请求代理到 Flask
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（视频生成可能需要很长时间）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 跨域支持
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";

        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # 视频文件代理
    location /videos/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 禁用缓冲，直接传输流
        proxy_buffering off;
        proxy_request_buffering off;

        # 增加缓冲区大小（如果必须缓冲）
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;

        # 超时配置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 跨域支持
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    # 健康检查
    location /api/health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }
}
